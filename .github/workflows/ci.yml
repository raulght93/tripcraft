name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (tsc estricto)
        run: pnpm typecheck
      - name: Lint + formato (Biome)
        run: pnpm lint
      - name: Tests núcleo (node:test) + cobertura
        run: pnpm test:coverage
      - name: Tests web (Vitest + axe)
        run: pnpm test:web
      - name: Build web (Vite)
        run: pnpm build
